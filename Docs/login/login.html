    <main class="main-login">
        <section class="target-login">
            <form class="login-form" method="POST">
                <div class="form-group-username">
                    <label for="username"><b>Username:</b></label>
                    <input id="username" class="username" type="text" name="username" placeholder="ex: @MrNasN" pattern="^@[a-zA-Z0-9_]+$" required>
                </div>

                <div class="form-group">
                    <label for="email" ><b>Email:</b></label>
                    <input id="email" class="email" type="email" placeholder="example@gmail.com" name="email" required>
                </div>
                
                <div class="form-group-password">
                    <label for="password" ><b>Password:</b></label>
                    <input id="password" class="password" type="password" placeholder="password" name="password" required>
                </div>

                <div class="form-button">
                    <input class="login-btn" type="submit" value="Login">
                </div>
            </form>
        </section>
    </main>
